name: Atualizar Lista Diariamente

on:
  schedule:
    # Roda todos os dias às 03:00 da manhã (horário de Brasília / 06:00 UTC)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar codigo do repositorio
      uses: actions/checkout@v3

    - name: Configurar o Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Executar o script de filtragem
      run: python script.py

    - name: Salvar alteracoes no GitHub
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email '[email protected]'
        git add lista.m3u
        git diff --quiet && git diff --staged --quiet || (git commit -m "Lista atualizada automaticamente" && git push)
        
